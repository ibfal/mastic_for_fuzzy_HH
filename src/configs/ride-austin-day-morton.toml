# Morton over a 1.024 degree box, 10 bits per axis (data_bits = 20): 0.001 degree cells whose
# edges sit half a data step off the 3-decimal coordinates, so the cells are exactly Mosaic's grid
# cells with two fewer tree levels than mosaic_grid. No rides are dropped. Same threshold as the
# other encodings; finds 8 / 5 / 8 cells (day / week / month), like mosaic_grid.
mode.weighted_heavy_hitters.threshold = 0.005

data_bits = 20
hist_buckets = 1

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

add_report_share_batch_size = 1000
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "data/mosaic/sample_busiest_day.csv"
encoding.morton = { min_lat = 29.9005, max_lat = 30.9245, min_lon = -98.0505, max_lon = -97.0265, axis_bits = 10 }
weight = "constant"
