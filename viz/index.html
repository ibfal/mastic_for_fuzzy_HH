<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastic Encodings Crawl</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --border: #deded8;
    --accent: #2457c5;
    --heavy-lo: 214 70% 78%;
    --heavy-hi: 222 75% 34%;
    --pruned: #9a9a93;
    --note-bg: #fff6dc;
    --note-text: #6a5100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --panel: #1e1e1c;
      --text: #ececE8;
      --muted: #a1a19b;
      --border: #34342f;
      --accent: #7ea2ff;
      --heavy-lo: 214 60% 40%;
      --heavy-hi: 210 90% 72%;
      --pruned: #8a8a83;
      --note-bg: #3a3218;
      --note-text: #f1d98a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --panel: #1e1e1c;
    --text: #ececE8;
    --muted: #a1a19b;
    --border: #34342f;
    --accent: #7ea2ff;
    --heavy-lo: 214 60% 40%;
    --heavy-hi: 210 90% 72%;
    --pruned: #8a8a83;
    --note-bg: #3a3218;
    --note-text: #f1d98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  label { color: var(--muted); font-size: 13px; }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 5px; color: var(--text); cursor: pointer; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .toggle:has(input:disabled) { color: var(--muted); cursor: default; }
  .crawl { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
  .crawl input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
  .level-readout { font-variant-numeric: tabular-nums; min-width: 72px; }
  .legend { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; }
  .swatch { display: inline-block; width: 14px; height: 10px; vertical-align: -1px; margin-right: 4px; border-radius: 2px; }
  .swatch.heavy { background: linear-gradient(90deg, hsl(var(--heavy-lo)), hsl(var(--heavy-hi))); }
  .swatch.pruned { border: 1.5px dashed var(--pruned); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }
  .pane {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 0;
  }
  .pane-head { padding: 8px 10px 6px; border-bottom: 1px solid var(--border); }
  .pane-head select { max-width: 100%; font-weight: 600; }
  .stats { margin-top: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }
  .note { margin-top: 4px; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: var(--note-bg); color: var(--note-text); }
  .note:empty { display: none; }
  .map { flex: 1; min-height: 220px; background: var(--bg); }
  .empty {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    margin: auto;
    max-width: 560px;
    padding: 24px;
    color: var(--muted);
  }
  .empty code { color: var(--text); }
  .leaflet-tooltip {
    font: 12px/1.35 system-ui, sans-serif;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.18);
  }
  .leaflet-tooltip-left::before { border-left-color: var(--panel); }
  .leaflet-tooltip-right::before { border-right-color: var(--panel); }
  .hist { margin-top: 6px; min-width: 210px; }
  .hist h4 { margin: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .hist .peak { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .hist svg { display: block; }
  .hist .bar { fill: var(--accent); }
  .hist .bar.top { fill: hsl(var(--heavy-hi)); }
  .hist .axis { fill: var(--muted); font-size: 9px; }
  .hist table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .hist td { padding: 1px 6px 1px 0; white-space: nowrap; }
  .hist td.n { text-align: right; }
  .hist td.pct { color: var(--muted); text-align: right; }
  .hist .track { width: 80px; height: 7px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .hist .fill { height: 100%; background: var(--accent); }
  .hint { margin-top: 4px; color: var(--muted); font-size: 11px; }
  .details {
    flex: 0 0 auto;
    max-height: 42vh;
    overflow: auto;
    margin: 0 8px 8px;
    padding: 10px 14px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .details[hidden] { display: none; }
  .details-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .details-title { font-size: 15px; font-weight: 650; }
  .details-meta { margin-top: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .details-meta b { color: var(--text); font-weight: 600; }
  .details-meta code { color: var(--text); }
  #details-close { font-size: 18px; line-height: 1; padding: 2px 9px; }
  .details-body { display: flex; flex-wrap: wrap; gap: 6px 32px; margin-top: 4px; }
  .details-body .empty-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .details .hist { margin-top: 0; min-width: 0; }
  .details .hist h4 { font-size: 11px; }
  .details .hist .track { width: 120px; height: 9px; }
  .details .hist td { font-size: 13px; padding: 2px 8px 2px 0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9); }
  }
  :root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9); }
  .leaflet-container { font: inherit; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: minmax(360px, 70vh); }
    header { padding: 10px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Mastic heavy-hitters crawl, by encoding</h1>
  <div>
    <label for="dataset">Dataset</label>
    <select id="dataset"></select>
  </div>
  <div class="crawl">
    <button id="play" title="Step through the levels (space)">Play</button>
    <input id="level" type="range" min="1" max="1" value="1" aria-label="Crawl level">
    <span class="level-readout" id="level-readout">level 1</span>
  </div>
  <div class="legend">
    <span><span class="swatch heavy"></span>heavy: expanded</span>
    <span><span class="swatch pruned"></span>below threshold: pruned</span>
  </div>
  <label class="toggle" title="Show every pane's run with weights (histograms of the final heavy cells)">
    <input type="checkbox" id="histograms"> Histograms
  </label>
  <button id="fit" title="Zoom to the heavy hitters">Fit</button>
</header>
<main id="grid"></main>
<section id="details" class="details" hidden aria-live="polite">
  <div class="details-head">
    <div>
      <div class="details-title" id="details-title"></div>
      <div class="details-meta" id="details-meta"></div>
    </div>
    <button id="details-close" aria-label="Close details (Esc)" title="Close (Esc)">×</button>
  </div>
  <div class="details-body" id="details-body"></div>
</section>

<!-- scripts/build_viz.py replaces null with every run, for the single-file copy. -->
<script id="inline-runs" type="application/json">null</script>
<script>
"use strict";

// Default run per pane: <dataset>-<encoding>.toml from scripts/run_encodings.sh.
const PANES = [
  { kind: "mosaic_grid", suffix: "mosaic-grid", title: "Mosaic grid" },
  { kind: "geohash", suffix: "geohash", title: "Geohash" },
  { kind: "h3", suffix: "h3", title: "H3" },
  { kind: "morton", suffix: "morton", title: "Morton" },
];

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem("mastic-viz:" + key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem("mastic-viz:" + key, JSON.stringify(value)); } catch {} },
};

function kindOf(encoding) {
  if (typeof encoding === "string") return encoding;
  if (encoding && typeof encoding === "object") return Object.keys(encoding)[0];
  return "unknown";
}

function datasetLabel(path) {
  return (path || "synthetic").split("/").pop().replace(/\.csv$/, "");
}

// Served over http: read viz/results live. Opened from disk: use the inlined copy.
async function loadRuns() {
  try {
    const manifest = await (await fetch("results/manifest.json", { cache: "no-store" })).json();
    const runs = {};
    await Promise.all(manifest.runs.map(async (r) => {
      runs[r.name] = await (await fetch("results/" + r.file, { cache: "no-store" })).json();
    }));
    if (Object.keys(runs).length) return { runs, source: "results/" };
  } catch {}
  try {
    const inline = JSON.parse(document.getElementById("inline-runs").textContent);
    if (inline && Object.keys(inline).length) return { runs: inline, source: "inlined" };
  } catch {}
  return { runs: {}, source: null };
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Sequential color for a heavy prefix: log of its count against the largest count shown.
function heavyColor(count, max) {
  const t = max > 1 ? Math.log(count) / Math.log(max) : 1;
  const [h0, s0, l0] = css("--heavy-lo").split(/\s+/).map(parseFloat);
  const [h1, s1, l1] = css("--heavy-hi").split(/\s+/).map(parseFloat);
  const mix = (a, b) => a + (b - a) * Math.min(1, Math.max(0, t));
  return `hsl(${mix(h0, h1)} ${mix(s0, s1)}% ${mix(l0, l1)}%)`;
}

function levelNote(run, level) {
  const kind = kindOf(run.encoding);
  if (kind === "h3" && level % 3 !== 0) {
    const res = run.encoding.h3;
    const prefixRes = res.resolution - run.data_bits / 3;
    return `Inside an H3 digit (bit ${level % 3} of 3 for resolution ${prefixRes + Math.ceil(level / 3)}): ` +
      "each candidate is a group of child hexagons, not a cell.";
  }
  if (level === run.data_bits) {
    return "Final level: the heavy prefixes are the output." +
      (hasHistograms(run) ? " Hover one for its histograms." : "");
  }
  if (hasHistograms(run)) {
    return "During the crawl the servers reveal only counts; histograms come with the final heavy cells.";
  }
  return "";
}

// Runs whose beta carries more than a plain count: their export names the blocks.
function hasHistograms(run) {
  return Array.isArray(run.blocks) && run.blocks.some((b) => b.weight !== "constant");
}

const BLOCK_TITLES = {
  hour_of_day: "Pickup hour",
  car_category: "Car category",
  surge: "Surge",
  dropoff_zone: "Drop-off",
};

function esc(text) {
  return String(text).replace(/[&<>"']/g, (ch) => `&#${ch.charCodeAt(0)};`);
}

// One tooltip section per block of beta. `value` is the cell's histograms followed by its count.
function histogramsHtml(run, value, large = false) {
  const total = value[value.length - 1];
  let offset = 0;
  const parts = [];
  for (const block of run.blocks) {
    const counts = value.slice(offset, offset + block.labels.length);
    offset += block.labels.length;
    if (block.weight === "constant") continue;
    const title = esc(BLOCK_TITLES[block.weight] || block.weight);
    parts.push(block.weight === "hour_of_day"
      ? hourChart(title, counts, large)
      : barTable(title, block.labels, counts, total));
  }
  // Large: one column per block, laid out side by side by the details panel.
  return large
    ? parts.map((part) => `<div class="hist">${part}</div>`).join("")
    : `<div class="hist">${parts.join("")}</div>`;
}

// 24 columns, one per hour; the busiest hour is darker and named in the heading.
function hourChart(title, counts, large = false) {
  const [w, gap, h] = large ? [14, 2, 80] : [7, 1, 34];
  const max = Math.max(1, ...counts);
  const peak = counts.indexOf(max);
  const bars = counts.map((n, i) => {
    const bh = n ? Math.max(1.5, (n / max) * h) : 0;
    return `<rect class="bar${i === peak ? " top" : ""}" x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}"><title>${String(i).padStart(2, "0")}h: ${fmt(n)}</title></rect>`;
  }).join("");
  const ticks = (large ? [0, 3, 6, 9, 12, 15, 18, 21, 23] : [0, 6, 12, 18, 23]).map((i) =>
    `<text class="axis" x="${i * (w + gap) + w / 2}" y="${h + 10}" text-anchor="middle">${i}</text>`).join("");
  const width = counts.length * (w + gap) - gap;
  return `<h4>${title} <span class="peak">· peak ${String(peak).padStart(2, "0")}h (${fmt(max)})</span></h4>` +
    `<svg width="${width}" height="${h + 12}" role="img" aria-label="${title} histogram">${bars}${ticks}</svg>`;
}

// One row per bucket: label, bar against the cell's total, count and share.
function barTable(title, labels, counts, total) {
  const rows = labels.map((label, i) => {
    const n = counts[i];
    const share = total ? n / total : 0;
    return `<tr><td>${esc(label)}</td>` +
      `<td><div class="track"><div class="fill" style="width:${(share * 100).toFixed(1)}%"></div></div></td>` +
      `<td class="n">${fmt(n)}</td><td class="pct">${Math.round(share * 100)}%</td></tr>`;
  }).join("");
  return `<h4>${title}</h4><table>${rows}</table>`;
}

function fmt(n) { return n.toLocaleString("en-US"); }

// The encoding and its parameters, in words.
function encodingText(encoding) {
  const kind = kindOf(encoding);
  const p = typeof encoding === "object" ? encoding[kind] : null;
  if (kind === "mosaic_grid") return "Mosaic grid, 0.001° cells";
  if (kind === "geohash") return `Geohash, ${esc(p.prefix)} + ${p.bits} bits`;
  if (kind === "h3") return `H3 resolution ${p.resolution}, inside ${esc(p.prefix)}`;
  if (kind === "morton") return `Morton (Z-order), ${p.axis_bits} bits per axis`;
  return esc(kind);
}

// The cell picked in a pane: which pane, run and prefix. Kept across re-renders.
function selectCell(paneIndex, runName, bits) {
  state.selected = { paneIndex, runName, bits };
  showDetails();
  render();
}

function closeDetails() {
  state.selected = null;
  showDetails();
  render();
}

function showDetails() {
  const panel = document.getElementById("details");
  const sel = state.selected;
  const run = sel ? state.runs[sel.runName] : null;
  const hit = run ? run.heavy_hitters.find((h) => h.bits === sel.bits) : null;
  const wasHidden = panel.hidden;
  panel.hidden = !hit;
  if (hit) {
    const pane = state.panes[sel.paneIndex];
    const share = run.num_clients ? (100 * hit.count) / run.num_clients : 0;
    document.getElementById("details-title").innerHTML =
      `${esc(pane.spec.title)} · ${esc(hit.label || "cell")}`;
    document.getElementById("details-meta").innerHTML =
      `Encoding <b>${encodingText(run.encoding)}</b> · run <code>${esc(sel.runName)}</code><br>` +
      `<b>${fmt(hit.count)}</b> rides (${share.toFixed(2)}% of ${fmt(run.num_clients)}, threshold ${fmt(run.threshold)}) · ` +
      (hit.center ? `centre <b>${hit.center[0].toFixed(4)}, ${hit.center[1].toFixed(4)}</b> · ` : "") +
      `prefix <code>${esc(hit.bits)}</code> (${hit.bits.length} bits)`;
    document.getElementById("details-body").innerHTML = hit.value && hasHistograms(run)
      ? histogramsHtml(run, hit.value, true)
      : `<div class="empty-note">This run has no weights, so the servers reveal only the count. ` +
        `Tick <b>Histograms</b> for runs with pickup hour, car category, surge and drop-off.</div>`;
  }
  // The maps lose height when the panel opens and get it back when it closes.
  if (wasHidden !== panel.hidden) for (const p of state.panes) p.map.invalidateSize();
}

const state = {
  runs: {},
  datasets: [],
  dataset: null,
  level: 1,
  panes: [],
  syncing: false,
  timer: null,
  // Prefer each encoding's run with weights (`<dataset>-<encoding>-all`) as the pane default.
  histograms: false,
  // The final heavy cell shown in the details panel: { paneIndex, runName, bits }.
  selected: null,
};

// OpenStreetMap's own tiles need no API key; dark mode inverts them in CSS.
function tiles() {
  return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  });
}

function buildPanes() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  state.panes = PANES.map((spec, i) => {
    const el = document.createElement("section");
    el.className = "pane";
    el.innerHTML = `
      <div class="pane-head">
        <select aria-label="Run shown in pane ${i + 1}"></select>
        <div class="stats"></div>
        <div class="note"></div>
      </div>
      <div class="map"></div>`;
    grid.appendChild(el);
    const map = L.map(el.querySelector(".map"), { zoomSnap: 0.25, preferCanvas: false });
    tiles().addTo(map);
    const layer = L.featureGroup().addTo(map);
    const pane = { spec, el, map, layer, select: el.querySelector("select"), run: null, runName: null };
    pane.select.addEventListener("change", () => {
      pane.runName = pane.select.value || null;
      store.set(`pane-${i}-${state.dataset}`, pane.runName);
      // Picking a run with weights (or going back to one without) switches the other panes too,
      // so all four encodings show the same kind of run. This pane keeps the run just picked.
      const run = pane.runName ? state.runs[pane.runName] : null;
      if (run && hasHistograms(run) !== state.histograms) return setHistograms(hasHistograms(run), i);
      updateSlider();
      render();
    });
    map.on("move", () => syncFrom(pane));
    return pane;
  });
}

function syncFrom(source) {
  if (state.syncing) return;
  state.syncing = true;
  const center = source.map.getCenter();
  const zoom = source.map.getZoom();
  for (const p of state.panes) if (p !== source) p.map.setView(center, zoom, { animate: false });
  state.syncing = false;
}

function runsForDataset(dataset) {
  return Object.entries(state.runs).filter(([, r]) => (r.dataset || "synthetic") === dataset);
}

function chooseDataset(dataset) {
  state.dataset = dataset;
  store.set("dataset", dataset);
  const allRuns = runsForDataset(dataset);
  state.panes.forEach((pane, i) => {
    // Each pane is one encoding: its menu lists only that encoding's runs (and their variants).
    const runs = allRuns.filter(([, r]) => kindOf(r.encoding) === pane.spec.kind);
    pane.select.innerHTML = "";
    const none = new Option(`${pane.spec.title}: no run`, "");
    pane.select.add(none);
    for (const [name, run] of runs) {
      const extra = hasHistograms(run) ? " · histograms" : "";
      pane.select.add(new Option(`${name}  (${run.data_bits} bits${extra})`, name));
    }
    const remembered = store.get(`pane-${i}-${dataset}`);
    const plain = runs.find(([n]) => n.endsWith("-" + pane.spec.suffix));
    const weighted = runs.find(([n]) => n.endsWith("-" + pane.spec.suffix + "-all"));
    const byName = (state.histograms && weighted) || plain;
    const byKind = runs.find(([, r]) => kindOf(r.encoding) === pane.spec.kind);
    const pick = runs.find(([n]) => n === remembered) || byName || byKind;
    pane.runName = pick ? pick[0] : null;
    pane.select.value = pane.runName || "";
  });
  const toggle = document.getElementById("histograms");
  toggle.disabled = !allRuns.some(([, r]) => hasHistograms(r));
  toggle.checked = state.histograms && !toggle.disabled;
  updateSlider();
  render();
  fit();
}

// Switch every pane between its plain run and its run with weights, then show the final level,
// the only one with histograms.
// `keepPane`: the pane whose run was just picked from its menu, left as it is.
function setHistograms(on, keepPane = -1) {
  state.histograms = on;
  store.set("histograms", on);
  state.panes.forEach((_, i) => {
    if (i !== keepPane) store.set(`pane-${i}-${state.dataset}`, null);
  });
  chooseDataset(state.dataset);
  if (on) setLevel(maxDepth());
}

function maxDepth() {
  return Math.max(1, ...state.panes.map((p) => (p.runName ? state.runs[p.runName].levels.length : 1)));
}

function updateSlider() {
  const slider = document.getElementById("level");
  slider.max = maxDepth();
  if (state.level > slider.max) state.level = +slider.max;
  slider.value = state.level;
}

function render() {
  // A selection belongs to one pane's run; drop it when that pane shows something else.
  const sel = state.selected;
  if (sel && (!state.panes[sel.paneIndex] || state.panes[sel.paneIndex].runName !== sel.runName)) {
    state.selected = null;
    showDetails();
  }
  document.getElementById("level-readout").textContent = `level ${state.level} / ${maxDepth()}`;
  // One color scale for all panes so the same count looks the same everywhere.
  let maxCount = 1;
  const shown = state.panes.map((p) => {
    const run = p.runName ? state.runs[p.runName] : null;
    if (!run) return null;
    const lvl = run.levels[Math.min(state.level, run.levels.length) - 1];
    for (const c of lvl.candidates) if (c.heavy) maxCount = Math.max(maxCount, c.count);
    return { run, lvl };
  });
  const pruned = css("--pruned");

  state.panes.forEach((pane, i) => {
    pane.layer.clearLayers();
    const stats = pane.el.querySelector(".stats");
    const note = pane.el.querySelector(".note");
    const s = shown[i];
    if (!s) {
      stats.textContent = "No saved run for this encoding. Run scripts/run_encodings.sh.";
      note.textContent = "";
      return;
    }
    const { run, lvl } = s;
    const heavy = lvl.candidates.filter((c) => c.heavy);
    const atEnd = state.level > run.levels.length;
    const rides = run.rides ? ` · <b>${fmt(run.rides.dropped)}</b> of ${fmt(run.rides.total)} rides outside the area` : "";
    stats.innerHTML =
      `level <b>${lvl.level}</b>/${run.data_bits}${atEnd ? " (final)" : ""} · ` +
      `<b>${lvl.candidates.length}</b> candidates · <b>${heavy.length}</b> heavy · ` +
      `threshold <b>${fmt(run.threshold)}</b> of ${fmt(run.num_clients)} clients${rides} · ` +
      `${(lvl.seconds * 1000).toFixed(0)} ms`;
    note.textContent = levelNote(run, lvl.level);

    // Pruned first so heavy regions draw on top.
    const ordered = [...lvl.candidates].sort((a, b) => a.heavy - b.heavy);
    for (const c of ordered) {
      if (!c.region.length) continue;
      const style = c.heavy
        ? { color: heavyColor(c.count, maxCount), weight: 1.2, fillColor: heavyColor(c.count, maxCount), fillOpacity: 0.55 }
        : { color: pruned, weight: 1, dashArray: "4 3", fillColor: pruned, fillOpacity: 0.06 };
      const poly = L.polygon(c.region.map((ring) => [ring]), style);
      const final = lvl.level === run.data_bits && c.heavy;
      const hit = final ? run.heavy_hitters.find((h) => h.bits === c.bits) : null;
      const sel = state.selected;
      if (hit && sel && sel.paneIndex === i && sel.runName === pane.runName && sel.bits === c.bits) {
        poly.setStyle({ color: css("--text"), weight: 3, dashArray: null });
      }
      poly.bindTooltip(
        `<b>${fmt(c.count)}</b> client${c.count === 1 ? "" : "s"} · ${c.heavy ? "heavy" : "pruned"}<br>` +
        `prefix <code>${c.bits}</code>` + (hit && hit.label ? `<br>${esc(hit.label)}` : "") +
        // The details (and histograms, the only cells whose beta the servers reveal) open below.
        (hit ? `<div class="hint">Click for details</div>` : ""),
        { sticky: true });
      if (hit) {
        poly.on("click", () => selectCell(i, pane.runName, c.bits));
      }
      pane.layer.addLayer(poly);
    }
  });
}

function fit() {
  // Zoom to the final heavy hitters of every pane; fall back to whatever is drawn.
  let bounds = null;
  for (const p of state.panes) {
    const run = p.runName ? state.runs[p.runName] : null;
    if (!run) continue;
    const last = run.levels[run.levels.length - 1];
    for (const c of last.candidates.filter((c) => c.heavy)) {
      for (const ring of c.region) {
        const b = L.latLngBounds(ring);
        bounds = bounds ? bounds.extend(b) : b;
      }
    }
  }
  if (!bounds) for (const p of state.panes) if (p.layer.getLayers().length) {
    const b = p.layer.getBounds();
    bounds = bounds ? bounds.extend(b) : b;
  }
  if (bounds) state.panes[0].map.fitBounds(bounds.pad(0.15));
  else for (const p of state.panes) p.map.setView([30.27, -97.74], 10);
}

function setLevel(level) {
  state.level = Math.max(1, Math.min(maxDepth(), level));
  document.getElementById("level").value = state.level;
  render();
}

function togglePlay() {
  const button = document.getElementById("play");
  if (state.timer) {
    clearInterval(state.timer);
    state.timer = null;
    button.textContent = "Play";
    return;
  }
  if (state.level >= maxDepth()) setLevel(1);
  button.textContent = "Pause";
  state.timer = setInterval(() => {
    if (state.level >= maxDepth()) return togglePlay();
    setLevel(state.level + 1);
  }, 700);
}

function showEmpty() {
  document.getElementById("grid").innerHTML = `
    <div class="empty">
      <p><b>No saved crawls found.</b></p>
      <p>Run the encodings and save their crawls, for example:</p>
      <p><code>scripts/run_encodings.sh synthetic-ten-locations</code></p>
      <p>Then either serve this folder (<code>python3 -m http.server -d viz 8080</code> and open
      <code>http://localhost:8080</code>) or open <code>viz/dist/mastic-crawl.html</code>,
      which has the runs built in.</p>
    </div>`;
}

async function main() {
  const { runs, source } = await loadRuns();
  state.runs = runs;
  if (!source) return showEmpty();
  state.datasets = [...new Set(Object.values(runs).map((r) => r.dataset || "synthetic"))].sort();

  buildPanes();
  const select = document.getElementById("dataset");
  for (const d of state.datasets) select.add(new Option(datasetLabel(d), d));
  const remembered = store.get("dataset");
  select.value = state.datasets.includes(remembered) ? remembered : state.datasets[0];
  select.addEventListener("change", () => chooseDataset(select.value));

  document.getElementById("level").addEventListener("input", (e) => setLevel(+e.target.value));
  document.getElementById("play").addEventListener("click", togglePlay);
  document.getElementById("fit").addEventListener("click", fit);
  document.getElementById("details-close").addEventListener("click", closeDetails);
  state.histograms = store.get("histograms") === true;
  document.getElementById("histograms").addEventListener("change", (e) => setHistograms(e.target.checked));
  document.addEventListener("keydown", (e) => {
    // The slider and the run menus handle their own arrow keys.
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") setLevel(state.level + 1);
    else if (e.key === "ArrowLeft") setLevel(state.level - 1);
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (e.key === "Escape" && state.selected) closeDetails();
  });

  chooseDataset(select.value);
}

main();
</script>
</body>
</html>
