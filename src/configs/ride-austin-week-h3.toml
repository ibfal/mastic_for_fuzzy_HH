# Same threshold as the other encodings; finds 26 / 27 / 29 cells (day / week / month).
mode.weighted_heavy_hitters.threshold = 0.005

data_bits = 21
hist_buckets = 1

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

add_report_share_batch_size = 1000
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "data/mosaic/sample_busiest_week.csv"
# All of Austin lies in H3 cell 82489ffffffffff (resolution 2); resolution 9 cells are ~0.1 km2,
# and only the 7 digits for resolutions 3-9 (21 bits) are sent.
encoding.h3 = { prefix = "82489ffffffffff", resolution = 9 }
weight = "constant"
