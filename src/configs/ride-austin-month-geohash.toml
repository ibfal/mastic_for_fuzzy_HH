# Same threshold as the mosaic-grid configs; finds 10 / 9 / 11 cells (day / week / month).
mode.weighted_heavy_hitters.threshold = 0.005

data_bits = 21
hist_buckets = 1

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

add_report_share_batch_size = 1000
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "data/mosaic/sample_busiest_month.csv"
# All of Austin lies in geohash 9v6; the 21 bits after it give 0.000687 x 0.001373 deg cells
# (~76 x 132 m, 0.0101 km2), the closest geohash area to Mosaic's 0.0107 km2 grid cells.
encoding.geohash = { prefix = "9v6", bits = 21 }
weight = "constant"
