# City map: the busiest RideAustin month with a synthetic company per ride
# (city/make_company_rides.py). Each company sends its rides as reports; beta is a one-hot over
# the four companies, so the city learns how many rides of each company every heavy cell has.
# Geohash: 21 bits after 9v6 (~76 x 132 m cells).
# 0.1% of 115,174 rides = 115 rides per heavy cell; finds ~140 cells.
mode.weighted_heavy_hitters.threshold = 0.001

data_bits = 21
hist_buckets = 4

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

add_report_share_batch_size = 1000
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "city/data/rides_month_companies.csv"
encoding.geohash = { prefix = "9v6", bits = 21 }
weight = "company"
# Bucket order; must match COMPANIES in city/make_company_rides.py.
companies = ["Uber", "Lyft", "Waymo", "RideAustin"]
