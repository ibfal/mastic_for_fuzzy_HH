# Cells as in ride-austin-day-mosaic-grid.toml (Mosaic's grid), with all four weights in one beta: pickup
# hour (24) | car category (4) | surge (2) | drop-off zone (4) = 34 buckets. Same zones as
# ride-austin-day-morton-all.toml.
# Single 0.001-degree cells rarely reach Mosaic's 2%; 0.5% finds 8 / 5 / 8 cells (day / week / month).
mode.weighted_heavy_hitters.threshold = 0.005

data_bits = 22
hist_buckets = 34

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

# 34 buckets make each VIDPF key ~18-21 KB; keep a batch of keys under tarpc's 8 MiB frame limit.
add_report_share_batch_size = 250
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "data/mosaic/sample_busiest_day.csv"
encoding = "mosaic_grid"
weight = ["hour_of_day", "car_category", "surge", "dropoff_zone"]

[[dataset.zones]]
name = "airport"
lat = 30.1975
lon = -97.6664
radius_km = 2.0

[[dataset.zones]]
name = "downtown"
lat = 30.2672
lon = -97.7431
radius_km = 1.2

[[dataset.zones]]
name = "ut_campus"
lat = 30.2849
lon = -97.7341
radius_km = 0.8

