# Morton cells as in ride-austin-day-morton.toml, with all four weights in one beta: pickup hour
# (24) | car category (4) | surge (2) | drop-off zone (4) = 34 buckets. One report per ride; the
# FLP checks that every block is one-hot. Same zones as ride-austin-day-morton-dropoff.toml.
mode.weighted_heavy_hitters.threshold = 0.005

data_bits = 20
hist_buckets = 34

server_0 = "0.0.0.0:8000"
server_1 = "0.0.0.0:8001"

# 34 buckets make each VIDPF key ~18 KB; keep a batch of keys under tarpc's 8 MiB frame limit.
add_report_share_batch_size = 300
# Larger batches exceed tarpc's 8 MiB frame limit (100000 fails on the month dataset).
query_flp_batch_size = 50000
zipf_unique_buckets = 1000
zipf_exponent = 1.03

[dataset]
path = "data/mosaic/sample_busiest_day.csv"
encoding.morton = { min_lat = 29.9005, max_lat = 30.9245, min_lon = -98.0505, max_lon = -97.0265, axis_bits = 10 }
weight = ["hour_of_day", "car_category", "surge", "dropoff_zone"]

[[dataset.zones]]
name = "airport"
lat = 30.1975
lon = -97.6664
radius_km = 2.0

[[dataset.zones]]
name = "downtown"
lat = 30.2672
lon = -97.7431
radius_km = 1.2

[[dataset.zones]]
name = "ut_campus"
lat = 30.2849
lon = -97.7341
radius_km = 0.8

